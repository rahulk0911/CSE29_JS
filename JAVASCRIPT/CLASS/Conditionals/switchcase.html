<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script text = "text/javascript">
       
       var grade = 'A';
       document.write("entering switch block<br/>");
       switch (grade)
       {
        case 'A': document.write("good<br/>"); break;
        case 'B': document.write("preety good<br/>"); break;
        case 'C': document.write("passed<br/>"); break;
        case 'D': document.write("failed<br/>"); break;
        case 'E': document.write("invalid<br/>"); break;
        default: document.write("Invalid grade<br/>");
       }
      document.write("exiting switch block<br/>");

    </script>
</body>
</html>
